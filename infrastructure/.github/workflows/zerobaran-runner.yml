# Social-Flow ZeroBaran runner — every 5 minutes
# Free GitHub Actions cron replaces a paid scheduler server.
name: ZeroBaran Runner

on:
  schedule:
    # Every 5 minutes (GitHub's minimum interval for free repos)
    - cron: "*/5 * * * *"
  workflow_dispatch:        # also triggerable manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: zerobaran-runner
  cancel-in-progress: false

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ZeroBaran runner
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE:  ${{ secrets.SUPABASE_SERVICE_ROLE }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          X_BEARER_TOKEN:         ${{ secrets.X_BEARER_TOKEN }}
          LINKEDIN_ACCESS_TOKEN:  ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          FACEBOOK_PAGE_TOKEN:    ${{ secrets.FACEBOOK_PAGE_TOKEN }}
        run: python runner.py
